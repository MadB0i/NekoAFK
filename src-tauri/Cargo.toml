[package]
name = "nekoafk"
version = "0.1.0"
description = "Local Windows agent companion"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Already pinned transitive Tauri dependencies; direct access for native crash callbacks.
webview2-com = "=0.39.1"
windows = "=0.62.2"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

