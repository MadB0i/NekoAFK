<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neko — character surface</title>
<link rel="stylesheet" href="./character/surface.css"><link rel="stylesheet" href="./character/rig.css"></head><body>
<main aria-label="Neko desktop companion">      <div class="neko-stage" id="nekoStage" role="img" aria-label="Neko, cat-girl companion — editing">
        <div class="neko-shadow"></div>
        <div class="neko-position">
          <div class="neko-motion">
            <img data-k="editing" class="neko-layer is-active" width="1138" height="1382" src="./assets/neko/neko-editing.png" alt="" draggable="false" />
            <img data-k="testing" class="neko-layer" width="1122" height="1402" src="./assets/neko/neko-testing.png" alt="" draggable="false" />
            <img data-k="failed" class="neko-layer" width="1122" height="1402" src="./assets/neko/neko-failed.png" alt="" draggable="false" />
            <img data-k="frustrated" class="neko-layer" width="1122" height="1402" src="./assets/neko/neko-frustrated.png" alt="" draggable="false" />
            <img data-k="verifying" class="neko-layer" width="1122" height="1402" src="./assets/neko/neko-verifying.png" alt="" draggable="false" />
            <img data-k="success" class="neko-layer" width="1122" height="1402" src="./assets/neko/neko-success.png" alt="" draggable="false" />
          </div>
        </div>
      </div>
</main>
<script src="./character/rig-contract.js"></script><script src="./character/layered-rig.js"></script><script src="./character/neko-character.js"></script><script src="./character/raster-stage.js"></script>
<script src="./desktop/surface-bridge.js"></script><script src="./character/surface.js"></script>
</body></html>
