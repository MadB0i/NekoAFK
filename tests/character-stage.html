<!doctype html><html><head><meta charset="UTF-8"><style>html,body{margin:0;overflow:hidden}svg{display:block;width:100%;height:100%;padding:2%;box-sizing:border-box}</style></head><body style="background:#f7f6f2"><div id="app" style="width:100vw;height:100vh"><div id="mascot" style="width:100%;height:100%"></div></div><script type="module">
// Native-window artist's stage. This file is not an application build entry.
import svg from '/assets/cat.svg?raw';
import {Character} from '/src/character.ts';
import {library,sample} from '/src/director.ts';
document.querySelector('#mascot').innerHTML=svg;
const c=new Character(document.querySelector('#mascot'),384);
const clips=[...new Map(Object.values(library).flat().map(a=>[a.id,a])).values()];
window.stage={clips:clips.map(a=>({id:a.id,duration:a.duration})),pose(id,t){const a=clips.find(a=>a.id===id);c.elapsed=t;c.paint(sample(a,t),a.prop||'',a.id,a.label,1,true);},play(id){cancelAnimationFrame(window.frame);const a=clips.find(a=>a.id===id);const start=performance.now();const frame=(now)=>{const t=(now-start)/1000;c.elapsed=t;c.paint(sample(a,t),a.prop||'',a.id,a.label,1/60,false);if(t<a.duration)window.frame=requestAnimationFrame(frame)};window.frame=requestAnimationFrame(frame)}};
window.stage.pose('listen',0);
</script></body></html>
