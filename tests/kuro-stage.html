<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kuro 2D Stage</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e1b2e 0%, #0d0c13 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mascot {
      position: relative;
      width: 440px;
      height: 480px;
    }
    .badge {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffd166;
      background: rgba(13, 12, 19, 0.75);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 209, 102, 0.3);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
  </style>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <div id="mascot"></div>
  </div>
  <div class="badge" id="badge">Kuro &mdash; Anime Companion</div>

  <script type="module">
    import { KuroCharacter, kuroMarkup } from '/src/kuro.ts';
    const mascot = document.getElementById('mascot');
    mascot.innerHTML = kuroMarkup();
    const kuro = new KuroCharacter(mascot);
    window.kuro = kuro;
    window.setBadge = (text) => { document.getElementById('badge').textContent = text; };
  </script>
</body>
</html>
